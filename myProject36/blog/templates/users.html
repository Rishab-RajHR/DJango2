<!DOCTYPE html>
<html>
<head>
<title>Users </title>
</head>
<body>
     <h1>Users List</h1>
     {% load cache %}
     {% cache 30 user_list_section %}
      <ul>
        {% for user in users %}
           <li>{{ user.name }} - {{ user.subscriber}}</li>
        {% endfor %}
      </ul>
      {% endcache %}
</body>
</html>
